config_version = 8

[bar.default]
auto_hide = true
reserve_space = false

[battery]
warning_threshold = 35

[calendar]
enabled = true

    [calendar.account.personal_google]
    type = "google"

[control_center.calendar]
event_time_format = "%I:%M %p"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[hooks]
started = "kitty --start-as=hidden --listen-on=unix:@kitty"

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

[notification]
filter_order = [ "filter" ]
history_retention_hours = 3

[plugin_settings."noctalia/screen_recorder"]
quality = "high"

[plugins]
enabled = [ "noctalia/screen_recorder" ]

[shell]
time_format = "{:%I:%M %p}"

    [shell.screenshot]
    confirm_region = true

[theme]
builtin = "Noctalia"
community_palette = "Rosey AMOLED"
mode = "dark"
source = "community"
wallpaper_scheme = "dysfunctional"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "kitty", "niri", "qt" ]
    community_ids = [ "zen-browser", "yazi" ]

[wallpaper.default]
path = "/home/p1ckal/Pictures/Wallpapers/omgwallpaper.png"

[wallpaper.last]
path = "/home/p1ckal/Pictures/Wallpapers/omgwallpaper.png"

[wallpaper.monitors.eDP-1]
path = "/home/p1ckal/Pictures/Wallpapers/omgwallpaper.png"

[widget.clock]
format = "{:%I:%M %p}"
